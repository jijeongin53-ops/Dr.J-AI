<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dr. J's 공식 로고 다운로드 (PNG / SVG)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Malgun Gothic', sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 40px 20px;
      line-height: 1.5;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #ffffff;
    }
    p.sub {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 32px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 28px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: #f1f5f9;
    }
    .card-desc {
      font-size: 13px;
      color: #94a3b8;
    }
    .preview-box {
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .preview-box svg {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 700;
      transition: all 0.15s ease;
    }
    .btn-png {
      background: #3b82f6;
      color: #ffffff;
    }
    .btn-png:hover {
      background: #2563eb;
    }
    .btn-svg {
      background: #334155;
      color: #e2e8f0;
    }
    .btn-svg:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Dr. J's 공식 로고 파일 다운로드</h1>
    <p class="sub">원하시는 로고 형태의 [고해상도 PNG 다운로드] 또는 [원본 SVG 다운로드] 버튼을 클릭하면 즉시 파일로 저장됩니다.</p>

    <div class="grid">
      <!-- 1. 정사각형 심볼 아이콘 로고 -->
      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">1. Dr. J 심볼 아이콘 로고 (1024 × 1024)</div>
            <div class="card-desc">당근 모임 프로필, 카카오톡 프로필, 앱 아이콘용 정사각형 로고</div>
          </div>
          <div class="btn-group">
            <button class="btn-png" onclick="downloadPNG('svg-badge', 1024, 1024, 'DrJ-Logo-Badge.png')">고해상도 PNG 다운로드</button>
            <button class="btn-svg" onclick="downloadSVG('svg-badge', 'DrJ-Logo-Badge.svg')">원본 SVG 다운로드</button>
          </div>
        </div>
        <div class="preview-box">
          <svg id="svg-badge" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="260" height="260">
            <defs>
              <linearGradient id="b_borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#3B82F6" />
                <stop offset="50%" stop-color="#38BDF8" />
                <stop offset="100%" stop-color="#4F46E5" />
              </linearGradient>
              <linearGradient id="b_textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#7DD3FC" />
                <stop offset="55%" stop-color="#DBEAFE" />
                <stop offset="100%" stop-color="#FFFFFF" />
              </linearGradient>
              <filter id="b_blueGlow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="24" result="blur1" />
                <feFlood flood-color="#4A85F6" flood-opacity="0.75" result="color1" />
                <feComposite in="color1" in2="blur1" operator="in" result="glow1" />
                <feMerge>
                  <feMergeNode in="glow1" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
              <filter id="b_textGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#4A85F6" flood-opacity="0.9" />
              </filter>
            </defs>
            <rect width="512" height="512" rx="110" fill="#05070B" />
            <rect x="36" y="36" width="440" height="440" rx="96" fill="url(#b_borderGrad)" filter="url(#b_blueGlow)" />
            <rect x="44" y="44" width="424" height="424" rx="88" fill="#09090B" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2" />
            <text x="256" y="295" text-anchor="middle" font-family="'Pretendard', 'Inter', 'Arial Black', sans-serif" font-size="128" font-weight="900" letter-spacing="-4" fill="url(#b_textGrad)" filter="url(#b_textGlow)">Dr. J</text>
          </svg>
        </div>
      </div>

      <!-- 2. 시네마틱 인트로 와이드 로고 -->
      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">2. DR. J'S 시네마틱 인트로 로고 (1920 × 1008)</div>
            <div class="card-desc">모임 대표 배너, 유튜브/강의 썸네일, 인트로 화면용 와이드 로고</div>
          </div>
          <div class="btn-group">
            <button class="btn-png" onclick="downloadPNG('svg-intro', 1920, 1008, 'DrJ-Logo-Cinematic.png')">고해상도 PNG 다운로드</button>
            <button class="btn-svg" onclick="downloadSVG('svg-intro', 'DrJ-Logo-Cinematic.svg')">원본 SVG 다운로드</button>
          </div>
        </div>
        <div class="preview-box">
          <svg id="svg-intro" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="720" height="378">
            <defs>
              <radialGradient id="i_bgFlare" cx="50%" cy="48%" r="45%">
                <stop offset="0%" stop-color="#2563EB" stop-opacity="0.38" />
                <stop offset="50%" stop-color="#0284C7" stop-opacity="0.16" />
                <stop offset="100%" stop-color="#000000" stop-opacity="0" />
              </radialGradient>
              <linearGradient id="i_ribbonMain" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
                <stop offset="50%" stop-color="#4A85F6" stop-opacity="0.65" />
                <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
              </linearGradient>
              <linearGradient id="i_badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#3B82F6" />
                <stop offset="50%" stop-color="#38BDF8" />
                <stop offset="100%" stop-color="#4F46E5" />
              </linearGradient>
              <linearGradient id="i_badgeText" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#7DD3FC" />
                <stop offset="55%" stop-color="#DBEAFE" />
                <stop offset="100%" stop-color="#FFFFFF" />
              </linearGradient>
              <linearGradient id="i_titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#60A5FA" />
                <stop offset="50%" stop-color="#38BDF8" />
                <stop offset="100%" stop-color="#A5B4FC" />
              </linearGradient>
              <filter id="i_glowStrong" x="-40%" y="-40%" width="180%" height="180%">
                <feDropShadow dx="0" dy="0" stdDeviation="28" flood-color="#4A85F6" flood-opacity="0.85" />
              </filter>
              <filter id="i_titleGlow" x="-30%" y="-30%" width="160%" height="160%">
                <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#4A85F6" flood-opacity="0.9" />
                <feDropShadow dx="0" dy="0" stdDeviation="36" flood-color="#38BDF8" flood-opacity="0.55" />
              </filter>
            </defs>
            <rect width="1200" height="630" fill="#000000" />
            <rect width="1200" height="630" fill="url(#i_bgFlare)" />
            <g opacity="0.55">
              <rect x="540" y="0" width="4" height="630" fill="url(#i_ribbonMain)" opacity="0.4" />
              <rect x="570" y="0" width="5" height="630" fill="url(#i_ribbonMain)" opacity="0.65" />
              <rect x="597" y="0" width="6" height="630" fill="url(#i_ribbonMain)" opacity="0.9" />
              <rect x="625" y="0" width="5" height="630" fill="url(#i_ribbonMain)" opacity="0.65" />
              <rect x="655" y="0" width="4" height="630" fill="url(#i_ribbonMain)" opacity="0.4" />
            </g>
            <g filter="url(#i_glowStrong)">
              <rect x="516" y="140" width="168" height="168" rx="38" fill="url(#i_badgeBorder)" />
              <rect x="520" y="144" width="160" height="160" rx="34" fill="#09090B" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.5" />
              <text x="600" y="243" text-anchor="middle" font-family="'Pretendard', 'Inter', 'Arial Black', sans-serif" font-size="52" font-weight="900" letter-spacing="-2" fill="url(#i_badgeText)">Dr. J</text>
            </g>
            <text x="614" y="425" text-anchor="middle" font-family="'Pretendard', 'Inter', 'Arial Black', sans-serif" font-size="86" font-weight="900" letter-spacing="28" fill="url(#i_titleGrad)" filter="url(#i_titleGlow)">DR. J'S</text>
            <text x="604" y="565" text-anchor="middle" font-family="monospace" font-size="14" font-weight="600" letter-spacing="8" fill="#71717A">ORIGINAL COMMUNITY SERIES</text>
          </svg>
        </div>
      </div>

      <!-- 3. 상단 헤더 가로형 로고 -->
      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">3. Dr. J's Hub 헤더 로고 (1200 × 320)</div>
            <div class="card-desc">문서 상단, 웹사이트 헤더, 강의안 표지용 가로형 로고</div>
          </div>
          <div class="btn-group">
            <button class="btn-png" onclick="downloadPNG('svg-header', 1200, 320, 'DrJ-Logo-Header.png')">고해상도 PNG 다운로드</button>
            <button class="btn-svg" onclick="downloadSVG('svg-header', 'DrJ-Logo-Header.svg')">원본 SVG 다운로드</button>
          </div>
        </div>
        <div class="preview-box">
          <svg id="svg-header" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="450" height="120">
            <rect width="600" height="160" rx="28" fill="#FFFFFF" />
            <circle cx="72" cy="80" r="14" fill="#4A85F6" />
            <text x="108" y="102" font-family="'Pretendard', 'Inter', 'Arial Black', sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5" fill="#09090B">Dr. J's</text>
            <text x="332" y="100" font-family="monospace" font-size="42" font-weight="600" fill="#9CA3AF">Hub</text>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <script>
    function downloadSVG(svgId, filename) {
      const svgEl = document.getElementById(svgId);
      const serializer = new XMLSerializer();
      let source = serializer.serializeToString(svgEl);
      if (!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)) {
        source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
      }
      const blob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function downloadPNG(svgId, width, height, filename) {
      const svgEl = document.getElementById(svgId);
      const serializer = new XMLSerializer();
      const source = serializer.serializeToString(svgEl);
      const svgBlob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      const img = new Image();
      img.onload = function () {
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        URL.revokeObjectURL(url);
        canvas.toBlob(function (pngBlob) {
          const pngUrl = URL.createObjectURL(pngBlob);
          const a = document.createElement('a');
          a.href = pngUrl;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(pngUrl);
        }, 'image/png');
      };
      img.src = url;
    }
  </script>
</body>
</html>
